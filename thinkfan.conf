# ThinkPad P1 Gen 4i - thinkfan config
# Kernel: 6.19+ / Fedora 43
# Sensor indices from /proc/acpi/ibm/thermal:
#   0=CPU  1=?  2=GPU/hot  3=DEAD(0°C)  4,5,6=board  7=DEAD(-128°C)

sensors:
  - tpacpi: /proc/acpi/ibm/thermal
    indices: [0, 1, 2, 4, 5, 6]

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Simple mode: [fan_level, lower_limit, upper_limit]
# fan_level = 0-7, "level auto", "level disengaged", "level full-speed"
# Ranges must overlap (lower < previous upper) to prevent oscillation
# levels:
#   - [0,                    0,  47]
#   - [1,                   43,  52]
#   - [2,                   49,  57]
#   - [3,                   54,  63]
#   - [4,                   60,  69]
#   - [5,                   65,  75]
#   - [6,                   71,  81]
#   - [7,                   77,  87]
#   - ["level disengaged",  83, 255]

# Exponential curve — band widths compress as temp rises: 6→5→4→4→4→3→3°C
# More aggressive than previous flat curve at every level
# Wide quiet zone at idle; fan steps up increasingly fast when hot
levels:
  - [0,                    0,  37]   # 6°C step — fan off at idle
  - [1,                   32,  43]   # 6°C step
  - [2,                   38,  48]   # 5°C step
  - [3,                   43,  52]   # 4°C step
  - [4,                   47,  56]   # 4°C step
  - [5,                   51,  60]   # 4°C step
  - [6,                   55,  63]   # 3°C step
  - [7,                   58,  66]   # 3°C step
  - ["level disengaged",  60, 255]   # triggers above 66°C
